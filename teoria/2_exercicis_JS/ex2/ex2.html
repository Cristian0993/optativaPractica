<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercici 2 - JavaScript</title>
    <link rel="stylesheet" href="../css/estils.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1>Exercici 2</h1>
                <p>JavaScript</p>
            </div>
        </header>

        <nav class="nav">
            <a href="../index.html">Llistat JS</a>
            <a href="../../../index.html">Portal d'exercicis</a>
        </nav>

        <main class="main">
            <section class="section">
                <h2>Exercici 2</h2>
                <div class="demo-box">
                    <p>Aquest exercici demana dos números i calcula suma, resta, multiplicació i divisió.</p>
                    <p class="console-note">Obre la consola del navegador per veure els resultats.</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Exercicis realitzats a classe de 1r SMX</p>
        </footer>
    </div>

    <script>
        // Exemple amb les operacions aritmetiques basiques
        let suma, resta, multiplicacio, divisio;

        let numero1 = prompt('Introdueix el primer número');
        let numero2 = prompt('Introdueix el segon número');

        suma = Number(numero1) + Number(numero2);
        resta = Number(numero1) - Number(numero2);
        multiplicacio = Number(numero1) * Number(numero2);
        divisio = Number(numero1) / Number(numero2);

        console.log(`El resultat de la SUMAR ${numero1} i ${numero2} es: ${suma}`);
        console.log(`El resultat de la RESTAR ${numero1} i ${numero2} es: ${resta}`);
        console.log(`El resultat de la MULTIPLICAR ${numero1} i ${numero2} es: ${multiplicacio}`);
        console.log(`El resultat de la DIVIDIR ${numero1} i ${numero2} es: ${divisio}`);
    </script>
</body>
</html>
