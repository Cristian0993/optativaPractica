<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comentarios</title>

    <style>
        .comentarios { width: 300px; margin: 20px auto; font-family: Arial; }
        .comentario { border-bottom: 1px solid #ccc; padding: 8px 0; }
        input, textarea { width: 100%; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="comentarios">
    <h3>Comentarios</h3>

    <input type="text" placeholder="Tu nombre">
    <textarea rows="2" placeholder="Escribe un comentario..."></textarea>
    <button>Enviar</button>

    <div class="comentario"><strong>Ana:</strong> Buen contenido.</div>
    <div class="comentario"><strong>Pedro:</strong> Me gusta esta página.</div>
</div>

</body>
</html>
